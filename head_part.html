<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCI - The Advertising Standards Council of India</title>
  <meta name="description"
    content="Independent self-regulation for responsible advertising in India. Explore codes, file complaints, and discover best practices for responsible advertising.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Domine:wght@400..700&display=swap"
    rel="stylesheet">
  <style>
@font-face {
  font-family: 'Domine';
  src: url('./Domine/Domine-VariableFont_wght.ttf') format('truetype-variations');
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Bricolage Grotesque';
  src: url('./Bricolage_Grotesque/BricolageGrotesque-VariableFont_opsz,wdth,wght.ttf') format('truetype-variations');
  font-weight: 200 800;
  font-style: normal;
  font-display: swap;
}

:root {
  --font-serif: 'Domine', Georgia, serif;
  --font-sans: 'Bricolage Grotesque', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  --color-bg: #FFFFFF;
  --color-text-main: #111827;
  --color-text-muted: #555B66;
  --color-text-light: #7A828F;

  --color-asci-green: #086b59;
  --color-asci-green-dark: #054c3f;
  --color-asci-teal: #008779;
  --color-asci-deep-green: #03362a;
  --color-dark-bg: #032b22;
  --color-dark-emerald: #053b2f;
  --color-accent-blue: #026095;
  --color-accent-orange: #e57200;
  --color-accent-yellow: #f5a623;

  --color-card-bg: #FFFFFF;
  --color-card-border: #E8ECEF;
  --color-card-hover-border: #cbd5e1;

  --container-max-w: 1280px;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 9999px;
  --transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  font-family: var(--font-sans);
  color: var(--color-text-main);
  background-color: var(--color-bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

a {
  text-decoration: none;
  color: inherit;
  transition: var(--transition);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  transition: var(--transition);
}

.container {
  width: 100%;
  max-width: var(--container-max-w);
  margin: 0 auto;
  padding: 0 0;
}

/* ================= TOP NOTIFICATION BAR ================= */
.top-notice-bar {
  background-color: #0b0f14;
  color: #e2e8f0;
  font-size: 0.8125rem;
  text-align: center;
  padding: 8px 16px;
  letter-spacing: 0.02em;
  font-weight: 400;
}

/* ================= HEADER & NAV ================= */
.site-header {
  background: #ffffff;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid #f0f2f5;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
}

.header-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  gap: 24px;
}

.mobile-burger-btn,
.mobile-search-btn,
.mobile-nav-overlay {
  display: none;
}

.header-logo-link {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  flex-shrink: 0;
}

.asci-logo-svg,
.site-logo-img {
  height: 48px;
  width: auto;
  display: block;
}

.mini-asci-logo-img {
  height: 22px;
  width: auto;
  display: block;
}

.footer-logo-img {
  height: 48px;
  width: auto;
  display: block;
  margin-bottom: 16px;
}

.header-search-bar {
  flex: 1;
  max-width: 520px;
  margin: 0 20px;
  position: relative;
}

.search-input-wrapper {
  display: flex;
  align-items: center;
  background: #ffffff;
  border: 1.2px solid #d0d7de;
  border-radius: var(--radius-pill);
  padding: 8px 18px;
  transition: var(--transition);
}

.search-input-wrapper:focus-within {
  border-color: var(--color-asci-teal);
  box-shadow: 0 0 0 3px rgba(0, 135, 121, 0.12);
}

.search-input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 0.9375rem;
  color: var(--color-text-main);
  background: transparent;
  font-family: inherit;
}

.search-icon-btn {
  color: #57606a;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: 8px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

.btn-ad-check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background-color: #0f172a;
  color: #ffffff;
  padding: 10px 20px;
  border-radius: var(--radius-pill);
  font-size: 0.9375rem;
  font-weight: 500;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

.btn-ad-check-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  background: #10b981;
  color: #ffffff;
  border-radius: 50%;
  font-size: 11px;
}

.btn-raise-complaint-top {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 1.2px solid #0f172a;
  color: #0f172a;
  padding: 9px 20px;
  border-radius: var(--radius-pill);
  font-size: 0.9375rem;
  font-weight: 500;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

/* ================= LEFT-TO-RIGHT GREEN HOVER FILL ANIMATION FOR ALL BUTTONS ================= */
.btn-ad-check,
.btn-raise-complaint-top,
.btn-hero-primary,
.btn-hero-secondary,
.btn-megamenu-explore,
.btn-explore-data,
.btn-explore-events,
.btn-cta-membership,
.action-tag-link {
  position: relative !important;
  overflow: hidden !important;
  z-index: 1 !important;
  transition: color 0.22s ease,
    border-color 0.22s ease,
    box-shadow 0.22s ease,
    transform 0.22s ease !important;
}

.btn-ad-check::before,
.btn-raise-complaint-top::before,
.btn-hero-primary::before,
.btn-hero-secondary::before,
.btn-megamenu-explore::before,
.btn-explore-data::before,
.btn-explore-events::before,
.btn-cta-membership::before,
.action-tag-link::before {
  content: '' !important;
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background: #008779 !important;
  /* ASCI Teal Green */
  z-index: -1 !important;
  transform: scaleX(0) !important;
  transform-origin: left center !important;
  transition: transform 0.22s ease !important;
  border-radius: inherit !important;
}

.btn-ad-check:hover::before,
.btn-raise-complaint-top:hover::before,
.btn-hero-primary:hover::before,
.btn-hero-secondary:hover::before,
.btn-megamenu-explore:hover::before,
.btn-explore-data:hover::before,
.btn-explore-events:hover::before,
.btn-cta-membership:hover::before,
.action-tag-link:hover::before {
  transform: scaleX(1) !important;
}

.btn-ad-check:hover,
.btn-raise-complaint-top:hover,
.btn-hero-primary:hover,
.btn-hero-secondary:hover,
.btn-megamenu-explore:hover,
.btn-explore-data:hover,
.btn-explore-events:hover,
.btn-cta-membership:hover,
.action-tag-link:hover {
  color: #ffffff !important;
  border-color: #008779 !important;
  box-shadow: 0 6px 20px rgba(0, 135, 121, 0.3) !important;
}

.btn-ad-check>*,
.btn-raise-complaint-top>*,
.btn-hero-primary>*,
.btn-hero-secondary>*,
.btn-megamenu-explore>*,
.btn-explore-data>*,
.btn-explore-events>*,
.btn-cta-membership>*,
.action-tag-link>* {
  position: relative !important;
  z-index: 2 !important;
  transition: color 0.22s ease, stroke 0.22s ease !important;
}

.btn-ad-check:hover svg,
.btn-raise-complaint-top:hover svg,
.btn-hero-primary:hover svg,
.btn-hero-secondary:hover svg,
.btn-megamenu-explore:hover svg,
.btn-explore-data:hover svg,
.btn-explore-events:hover svg,
.btn-cta-membership:hover svg,
.action-tag-link:hover svg {
  stroke: #ffffff !important;
  color: #ffffff !important;
}

/* Sub Navigation Row */
.header-nav-row {
  border-top: 1px solid #f1f5f9;
  background: #ffffff;
  position: relative;
}

.header-nav-row::after {
  content: '';
  display: block;
  width: 100%;
  height: 3.5px;
  background: linear-gradient(to right,
      #008779 0%, #008779 26%,
      #e11d48 26%, #e11d48 50%,
      #f59e0b 50%, #f59e0b 72%,
      #026095 72%, #026095 86%,
      #38bdf8 86%, #38bdf8 100%);
}

.nav-menu-list {
  display: flex;
  align-items: center;
  justify-content: space-between;
  list-style: none;
  padding: 0;
  margin: 0;
}

.nav-item {
  position: relative;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 14px 10px;
  font-size: 0.9375rem;
  font-weight: 500;
  color: #1f2937;
  cursor: pointer;
  transition: var(--transition);
}

.nav-link:hover,
.nav-item.active .nav-link {
  color: var(--color-asci-teal);
  border-bottom-color: var(--color-asci-teal);
}

.chevron-icon {
  width: 13px;
  height: 13px;
  stroke: currentColor;
  transition: transform 0.2s ease;
}

.nav-item.open .chevron-icon {
  transform: rotate(180deg);
}

/* ================= MEGAMENU DRAWER ================= */
.megamenu-panel {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  background: #ffffff;
  border-top: 1px solid #e2e8f0;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
  padding: 36px 0 44px;
  z-index: 99;
}

.megamenu-panel.active {
  display: block;
  animation: slideDown 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.megamenu-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr 1fr 1fr;
  gap: 36px;
}

.megamenu-highlight-col {
  padding-right: 24px;
  border-right: 1px solid #efefef;
}

.megamenu-highlight-title {
  font-family: var(--font-sans);
  font-size: 1.5rem;
  font-weight: 700;
  color: #0076a8;
  line-height: 1.25;
  margin-bottom: 14px;
}

.megamenu-highlight-desc {
  font-size: 0.92rem;
  color: #4b5563;
  line-height: 1.5;
  margin-bottom: 24px;
}

.btn-megamenu-explore {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1.2px solid #0f172a;
  border-radius: var(--radius-pill);
  padding: 9px 20px;
  font-size: 0.9rem;
  font-weight: 600;
  color: #0f172a;
}

.btn-megamenu-explore:hover {
  background: #0f172a;
  color: #ffffff;
}

.megamenu-col {
  padding-left: 8px;
}

.megamenu-col-title {
  font-family: var(--font-sans);
  font-size: 1.25rem;
  font-weight: 700;
  color: #0f172a;
  margin-bottom: 20px;
}

.megamenu-links-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.megamenu-link-item a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.9375rem;
  color: #374151;
  font-weight: 500;
  gap: 8px;
  line-height: 1.35;
}

.megamenu-link-item a:hover {
  color: var(--color-asci-teal);
  transform: translateX(3px);
}

.arrow-diag-icon {
  width: 14px;
  height: 14px;
  stroke: #9ca3af;
  transition: var(--transition);
  flex-shrink: 0;
}

.megamenu-link-item a:hover .arrow-diag-icon {
  stroke: var(--color-asci-teal);
}

/* ================= MEGAMENU CUSTOM GRID STRUCTURES ================= */
.about-mega-grid-3col {
  display: grid;
  grid-template-columns: 280px 1.5fr 1.5fr;
  gap: 40px;
  align-items: start;
}

.megamenu-2col-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 28px;
  row-gap: 0;
}

@media (max-width: 1200px) {
  .about-mega-grid-3col {
    grid-template-columns: 240px 1.4fr 1.4fr;
    gap: 24px;
  }
  .megamenu-2col-list {
    grid-template-columns: 1fr 1fr;
    column-gap: 18px;
  }
}

@media (max-width: 991px) {
  .about-mega-grid-3col {
    grid-template-columns: 1fr;
    gap: 28px;
  }
}

.academy-mega-grid-6col {
  display: grid;
  grid-template-columns: 1.1fr repeat(3, 1fr);
  gap: 32px 36px;
  align-items: start;
}

.academy-mega-grid-6col>.megamenu-highlight-col {
  grid-row: 1 / span 2;
}

.academy-mega-grid-6col>.megamenu-col:nth-child(5),
.academy-mega-grid-6col>.megamenu-col:nth-child(6) {
  border-top: 1px solid #e2e8f0;
  padding-top: 32px;
}

.topics-resources-mega-grid {
  display: grid;
  grid-template-columns: 1.1fr repeat(3, 1fr);
  gap: 36px;
  align-items: start;
}

.topics-resources-mega-grid>.megamenu-highlight-col {
  grid-row: 1 / span 2;
}

.topics-resources-mega-grid .resource-library-col {
  grid-column: 2 / span 3;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 24px 32px;
  text-align: left;
}

.topics-resources-mega-grid .resource-library-col .megamenu-col-title {
  margin-bottom: 20px;
}

.topics-resources-mega-grid .resource-library-col .megamenu-links-list {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px 32px;
  text-align: left;
}

.membership-mega-grid {
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  gap: 48px;
  align-items: start;
}

.mega-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}

.mega-section-head .megamenu-col-title {
  margin-bottom: 0;
}

.membership-links-3by2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px 32px;
}

.new-mega-grid {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 48px;
  align-items: start;
}

.new-links-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px 28px;
}

/* ================= HERO SECTION ================= */
.hero-section {
  padding: 64px 0 60px;
  position: relative;
  background: #ffffff;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 40px;
  align-items: center;
}

.hero-content {
  max-width: 620px;
  z-index: 2;
  position: relative;
}

.hero-title {
  font-family: var(--font-serif);
  font-size: 3.8rem;
  line-height: 1.15;
  font-weight: 400;
  color: #0d0d0d;
  letter-spacing: -0.02em;
  margin-bottom: 22px;
}

.hero-description {
  font-size: 1.1rem;
  line-height: 1.6;
  color: #4b5563;
  margin-bottom: 34px;
  max-width: 620px;
}

.hero-cta-group {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 12px;
}

.btn-hero-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #0b0f14;
  color: #ffffff;
  padding: 11px 22px;
  border-radius: var(--radius-pill);
  font-size: 0.92rem;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
}

.btn-hero-primary:hover {
  background: #1e293b;
  transform: translateY(-2px);
}

.btn-hero-secondary {
  display: inline-flex;
  align-items: center;
  border: 1.2px solid #0b0f14;
  color: #0b0f14;
  padding: 11px 22px;
  border-radius: var(--radius-pill);
  font-size: 0.92rem;
  font-weight: 600;
  white-space: nowrap;
  background: #ffffff;
}

.btn-hero-secondary:hover {
  background: #f8fafc;
  transform: translateY(-1px);
}

/* Hero Visual Stack Card & Arc */
.hero-visual {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.hero-bg-arc {
  position: absolute;
  top: -310px;
  right: -290px;
  width: 750px;
  height: 1300px;
  pointer-events: none;
  z-index: 0;
}

.hero-card-stack,
.deck-container {
  position: relative;
  width: 100%;
  max-width: 360px;
  height: 470px;
  margin: 0 auto;
  z-index: 2;
}

.khaitan-top-badge {
  position: absolute;
  top: -14px;
  right: -10px;
  z-index: 30;
  font-size: 0.68rem;
  font-weight: 700;
  color: #334155;
  background: #ffffff;
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid #cbd5e1;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
  transition: all 0.35s ease;
}

.deck-card {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  background: #ffffff;
  border-radius: 18px;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
  border: 1.2px solid #e2e8f0;
  overflow: hidden;
  padding: 16px 16px 18px;
  transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
    opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
    box-shadow 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform, opacity;
  cursor: pointer;
}

/* Card Stack Layer Positions */
.deck-card.pos-0 {
  z-index: 10;
  transform: translate(0, 0) scale(1) rotate(0deg);
  opacity: 1;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
}

.deck-card.pos-1 {
  z-index: 8;
  transform: translate(16px, -12px) scale(0.96) rotate(9deg);
  opacity: 0.95;
  box-shadow: 8px 12px 28px rgba(0, 0, 0, 0.08);
}

.deck-card.pos-2 {
  z-index: 6;
  transform: translate(-18px, 12px) scale(0.92) rotate(-9deg);
  opacity: 0.9;
  box-shadow: -6px 12px 24px rgba(0, 0, 0, 0.07);
}

.deck-card.pos-3 {
  z-index: 4;
  transform: translate(14px, 18px) scale(0.88) rotate(4deg);
  opacity: 0.8;
  box-shadow: 4px 10px 20px rgba(0, 0, 0, 0.05);
}

/* Top Card Fade Away Animations */
.deck-card.fade-away-left {
  z-index: 25 !important;
  transform: translate(-70px, -10px) scale(0.94) rotate(-5deg) !important;
  opacity: 0 !important;
}

.deck-card.fade-away-right {
  z-index: 25 !important;
  transform: translate(70px, -10px) scale(0.94) rotate(5deg) !important;
  opacity: 0 !important;
}

.slider-viewport {
  overflow: hidden;
  width: 100%;
  border-radius: 12px;
}

.slider-track {
  display: flex;
  width: 400%;
  transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform;
}

.hero-slide-item {
  width: 25%;
  flex-shrink: 0;
  box-sizing: border-box;
}

.report-card-illustration {
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #e2e8f0;
  background: #f8fafc;
}

.report-cover-img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
  border-radius: 10px;
  transition: opacity 0.25s ease;
}

.report-card-bottom {
  margin-top: 14px;
  padding: 2px 4px;
}

.report-asci-brand-row {
  margin-bottom: 6px;
}

.mini-asci-logo {
  height: 22px;
  width: auto;
}

.report-card-title {
  font-family: var(--font-sans);
  font-size: 0.9375rem;
  font-weight: 800;
  color: #0b0f14;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-top: 2px;
}

.report-card-subtitle {
  font-size: 0.72rem;
  font-weight: 700;
  color: #64748b;
  letter-spacing: 0.05em;
  margin-top: 2px;

/* ================= SEARCH OVERLAY POPUP MODAL ================= */
.search-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(15, 23, 42, 0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 9999;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 120px;
  animation: searchOverlayFadeIn 0.25s ease forwards;
}

.search-overlay.open {
  display: flex;
}

@keyframes searchOverlayFadeIn {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

.search-box {
  width: min(740px, calc(100% - 36px));
  background: #ffffff;
  border-radius: 24px;
  padding: 36px 36px 32px;
  position: relative;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28), 0 4px 16px rgba(0, 0, 0, 0.08);
  animation: searchBoxSlideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes searchBoxSlideDown {
  from {
    transform: translateY(-20px) scale(0.97);
    opacity: 0;
  }

  to {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
}

.search-close-btn {
  position: absolute;
  top: 22px;
  right: 26px;
  background: none;
  border: none;
  font-size: 22px;
  color: #64748b;
  cursor: pointer;
  padding: 6px;
  line-height: 1;
  border-radius: 50%;
  transition: all 0.2s ease;
}

.search-close-btn:hover {
  color: #0f172a;
  background: #f1f5f9;
}

.search-eyebrow {
  font-size: 0.8125rem;

  text-transform: uppercase;

  margin-bottom: 8px;
}

.search-modal-title {
  font-family: var(--font-sans);
  font-size: 2.2rem;
  font-weight: 800;
  color: #0f172a;
  margin: 0 0 24px;
  letter-spacing: -0.01em;
}

.search-row {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 22px;
}

.search-row input {
  flex: 1;
  border: none;
  border-bottom: 2.5px solid #0f172a;
  font-size: 1.2rem;
  padding: 10px 4px;
  outline: none;
  color: #0f172a;
  font-family: inherit;
  font-weight: 500;
  background: transparent;
  transition: border-color 0.2s ease;
}

.search-row input::placeholder {
  color: #94a3b8;
  font-size: 1.1rem;
  font-weight: 400;
}

.search-row input:focus {
  border-bottom-color: #0284c7;
}

.btn-search-submit {
  background: #1e293b;
  color: #ffffff;
  border: none;
  border-radius: var(--radius-pill);
  padding: 12px 30px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.btn-search-submit:hover {
  background: #0284c7;
  transform: translateY(-1px);
}

.search-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.search-pill {
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  border-radius: var(--radius-pill);
  padding: 7px 18px;
  font-size: 0.85rem;
  font-weight: 700;
  color: #1e293b;

  transition: all 0.2s ease;
}

.search-pill:hover {
  background: #0f172a;
  color: #ffffff;
  border-color: #0f172a;
  transform: translateY(-1px);
}

.search-result-box {

  padding: 12px 6px;
  border-bottom: 1px solid #f1f5f9;
  font-weight: 600;
  font-size: 0.95rem;
  color: #0f172a;
  text-decoration: none;
  transition: all 0.2s ease;
}

.search-result-box a:hover {
  color: #0284c7;
